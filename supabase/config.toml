# Supabase CLI configuration for local development (`supabase start`).
# Production projects are configured in the Supabase dashboard with the same values.
project_id = "mdpeds-logbook"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "mdpeds://auth-callback"
additional_redirect_urls = ["mdpeds://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Accounts are created only through HOD invitations.
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.rate_limit]
email_sent = 30

[functions.invite-user]
verify_jwt = true
